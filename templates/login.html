<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - DemandThread</title>

  <!-- Linked stylesheets and the body start-->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

  <!-- Login page layout -->
  <main class="login-page">
    <section class="card-box login-box">
      <h1 class="page-title">DemandThread</h1>
      <p class="text-muted">Sign in to continue</p>
   
       <!-- login form with role selection -->
      <form action="dashboard.html">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" minlength="8" required>
          <p class="text-muted">At least 8 characters.</p>
        </div>
        <div class="mb-3">
          <label for="role" class="form-label">Role</label>
          <select id="role" name="role" class="form-select" required>
            <option value="">Choose your role...</option>
            <option value="buyer">Buyer</option>
            <option value="planner">Planner</option>
            <option value="supplier">Supplier</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>

   
    </section>
  </main>
</body>
</html>
