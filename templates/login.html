<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in - DemandThread</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="login-page">
    <section class="card-box login-box">
      <h1 class="page-title">DemandThread</h1>
      <p class="text-muted">Sign in to continue</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" name="password" class="form-control" minlength="8" required>
          <p class="text-muted">At least 8 characters.</p>
        </div>
        <button type="submit" class="btn btn-primary">Sign in</button>
      </form>

      <p class="text-muted">Just viewing the demo?</p>
      <a href="/" class="btn btn-secondary">Skip sign in</a>
    </section>
  </main>
</body>
</html>
